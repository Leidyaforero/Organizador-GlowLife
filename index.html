/* ===== Actualizaciones inteligentes de GlowLife ===== */

if ('serviceWorker' in navigator) {

  let refreshing = false;
  let waitingWorker = null;

  // Crear aviso de actualización
  const updateBox = document.createElement('div');

  updateBox.id = 'gl-update-box';

  updateBox.innerHTML = `
    <div style="
      position:fixed;
      left:16px;
      right:16px;
      bottom:100px;
      z-index:9999;
      max-width:520px;
      margin:auto;
      padding:16px;
      border-radius:18px;
      background:#ffffff;
      color:#3b2d78;
      box-shadow:0 8px 30px rgba(0,0,0,.18);
      border:1px solid #d9ccfa;
      font-family:system-ui,sans-serif;
    ">
      <div style="font-weight:700;font-size:15px">
        ✨ ¡GlowLife tiene una nueva versión!
      </div>

      <p style="font-size:13px;margin:7px 0 12px">
        Hay mejoras disponibles para tu aplicación.
      </p>

      <button id="gl-update-button" style="
        width:100%;
        padding:12px;
        border:0;
        border-radius:10px;
        background:#9d8ae8;
        color:white;
        font-weight:700;
        font-size:14px;
      ">
        Actualizar ahora
      </button>

      <button id="gl-update-later" style="
        width:100%;
        padding:9px;
        margin-top:5px;
        border:0;
        background:transparent;
        color:#7a7390;
      ">
        Más tarde
      </button>
    </div>
  `;

  document.body.appendChild(updateBox);
  updateBox.style.display = 'none';

  function showUpdate(worker) {
    waitingWorker = worker;
    updateBox.style.display = 'block';
  }

  // Aceptar actualización
  document.getElementById('gl-update-button')
    .addEventListener('click', () => {

      if (waitingWorker) {
        waitingWorker.postMessage('SKIP_WAITING');
      }
    });

  // Posponer actualización
  document.getElementById('gl-update-later')
    .addEventListener('click', () => {
      updateBox.style.display = 'none';
    });

  // Recargar cuando la nueva versión tome el control
  navigator.serviceWorker.addEventListener(
    'controllerchange',
    () => {
      if (refreshing) return;

      refreshing = true;
      window.location.reload();
    }
  );

  // Registrar aplicación
  navigator.serviceWorker.register('./sw.js', {
    updateViaCache: 'none'
  }).then(registration => {

    // Comprobar si ya hay una actualización esperando
    if (registration.waiting &&
        navigator.serviceWorker.controller) {
      showUpdate(registration.waiting);
    }

    // Detectar nuevas versiones
    registration.addEventListener('updatefound', () => {

      const newWorker = registration.installing;

      if (!newWorker) return;

      newWorker.addEventListener('statechange', () => {

        if (
          newWorker.state === 'installed' &&
          navigator.serviceWorker.controller
        ) {
          showUpdate(newWorker);
        }
      });
    });

    // Buscar actualizaciones
    registration.update().catch(() => {});

    // Revisar al volver a la aplicación
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        registration.update().catch(() => {});
      }
    });

    // Revisar al recuperar conexión
    window.addEventListener('online', () => {
      registration.update().catch(() => {});
    });

  }).catch(error => {
    console.warn('GlowLife: el modo sin conexión no está disponible en este entorno (falta sw.js).');
  });
}

const ncard=n=>{const g=S.goals.find(x=>x.id==n.g),k=S.tasks.find(x=>x.id==n.tk);return `<div class="c it" style="cursor:pointer" onclick="noteForm(${n.id})"><div class="row sp"><b class="g1">${E(nti(n))}</b><button class="chip" onclick="event.stopPropagation();nfav(${n.id})" aria-label="Favorita" style="${n.fav?'background:var(--pri);color:var(--onp)':''}">${n.fav?'★':'☆'}</button></div>${n.t&&n.body?`<p class="mu" style="margin:4px 0;white-space:pre-wrap;overflow:hidden;max-height:3em">${E(n.body)}</p>`:''}<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px"><span class="chip" style="padding:3px 10px">${E(n.cat)}</span>${n.tags.map(x=>`<span class="chip" style="padding:3px 10px">#${E(x)}</span>`).join('')}${g?`<span class="chip" style="padding:3px 10px">Meta: ${E(g.t)}</span>`:''}${k?`<span class="chip" style="padding:3px 10px">Tarea: ${E(k.t)}</span>`:''}</div><div class="mu" style="margin-top:6px;font-size:12px">Creada ${fdt(n.created)}${n.mod!=n.created?' · Editada '+fdt(n.mod):''}</div></div>`};
const nl=()=>{const q=nrm(V.nq||''),c=V.nc||'',t=V.ntg||'';return S.notes.filter(n=>(!V.nf||n.fav)&&(!c||n.cat==c)&&(!t||n.tags.includes(t))&&(!q||nrm(n.t+' '+n.body+' '+n.tags.join(' ')+' '+n.cat).includes(q))).sort((a,b)=>!!b.fav-!!a.fav||(b.mod>a.mod?1:-1)).map(ncard).join('')||(S.notes.length?'<p class="mu">Sin resultados.</p>':empty('note','Sin notas todavía','Guarda ideas, información importante y pendientes.','Nueva nota','noteForm()'))};
function noteForm(id,pre){const n=S.notes.find(x=>x.id==id)||pre||{};sheet(`<h2 style="margin:0">${id?'Editar nota':'Nueva nota'}</h2><input id="nt" placeholder="Título (opcional)" value="${E(n.t||'')}"><textarea id="nb" rows="6" placeholder="Escribe aquí…">${E(n.body||'')}</textarea><div class="f2"><label>Categoría<input id="nc" list="ncl" maxlength="24" value="${E(n.cat||'Idea')}"><datalist id="ncl">${[...new Set([...NC,...S.notes.map(x=>x.cat)])].map(c=>`<option value="${E(c)}">`).join('')}</datalist></label><label>Etiquetas<input id="ng" placeholder="trabajo, ideas" value="${E((n.tags||[]).join(', '))}"></label></div><div class="f2"><label>Meta<select id="nl"><option value="">Ninguna</option>${S.goals.map(g=>`<option value="${g.id}" ${g.id==n.g?'selected':''}>${E(g.t)}</option>`).join('')}</select></label><label>Tarea<select id="nk"><option value="">Ninguna</option>${S.tasks.map(x=>`<option value="${x.id}" ${x.id==n.tk?'selected':''}>${E(x.t)}</option>`).join('')}</select></label></div><label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px"><input type="checkbox" id="nf" style="width:20px;min-height:20px" ${n.fav?'checked':''}> Favorita</label>${id?`<p class="mu">Creada ${fdt(n.created)} · Modificada ${fdt(n.mod)}</p>`:''}<button class="b" onclick="saveNote(${id||0})">Guardar</button>${id?`<button class="b b2" onclick="ask('¿Eliminar esta nota?','Eliminar',()=>delNote(${id}))">Eliminar</button>`:''}`)}
function saveNote(id){const t=$('#nt').value.trim(),body=$('#nb').value.trim();if(!t&&!body)return toast('Escribe algo en la nota');const o={t,body,cat:$('#nc').value.trim()||'Idea',tags:tg($('#ng').value),g:$('#nl').value?+$('#nl').value:'',tk:$('#nk').value?+$('#nk').value:'',fav:$('#nf').checked},n=S.notes.find(x=>x.id==id),now=new Date().toISOString();if(n){if(JSON.stringify([n.t,n.body,n.cat,n.tags,n.g,n.tk,!!n.fav])!=JSON.stringify([o.t,o.body,o.cat,o.tags,o.g,o.tk,o.fav]))n.mod=now;Object.assign(n,o);emit('note.updated',{id:n.id})}else{const x={id:nid2(S.notes),created:now,mod:now,...o};S.notes.push(x);emit('note.created',{id:x.id})}save();shut();render()}
function qn(){const i=$('#qn'),v=i.value.trim();if(!v)return toast('Escribe tu idea');const now=new Date().toISOString(),n={id:nid2(S.notes),t:'',body:v,cat:'Idea',tags:[],g:'',tk:'',fav:false,created:now,mod:now};S.notes.push(n);emit('note.created',{id:n.id});save();render();toast('Nota guardada','ok')}
function nfav(id){const n=S.notes.find(x=>x.id==id);n.fav=!n.fav;save();render()}
function delNote(id){S.notes=S.notes.filter(x=>x.id!=id);emit('note.deleted',{id});save();shut();render()}
const gnotes=gid=>{const l=S.notes.filter(n=>n.g==gid);return l.length?`<p class="mu">Notas vinculadas</p><div class="row" style="flex-wrap:wrap;gap:6px">${l.map(n=>`<button class="chip" onclick="noteForm(${n.id})">${E(nti(n))}</button>`).join('')}</div>`:''};
const notesTab=()=>{const cs=[...new Set(S.notes.map(n=>n.cat))],ts=[...new Set(S.notes.flatMap(n=>n.tags))];return `<div class="row" style="margin:0 20px 10px"><input id="qn" placeholder="Escribe una idea rápida…" onkeydown="event.key=='Enter'&&qn()" aria-label="Nota rápida"><button class="b" onclick="qn()" aria-label="Guardar nota rápida">${I('plus',16)}</button></div><div class="row" style="margin:0 20px 10px"><input type="search" placeholder="Buscar notas…" value="${E(V.nq||'')}" oninput="V.nq=this.value;$('#nlist').innerHTML=nl()" aria-label="Buscar notas"><button class="b b2" onclick="noteForm()">Nueva</button></div><div class="chips"><button class="chip ${!V.nf&&!V.nc&&!V.ntg?'on':''}" onclick="V.nf=0;V.nc='';V.ntg='';render()">Todas</button><button class="chip ${V.nf?'on':''}" onclick="V.nf=!V.nf;render()">★ Favoritas</button>${cs.map(c=>`<button class="chip ${V.nc==c?'on':''}" onclick="V.nc=V.nc=='${E(c)}'?'':'${E(c)}';render()">${E(c)}</button>`).join('')}${ts.map(t=>`<button class="chip ${V.ntg==t?'on':''}" onclick="V.ntg=V.ntg=='${E(t)}'?'':'${E(t)}';render()">#${E(t)}</button>`).join('')}</div><div id="nlist" style="padding:0 20px">${nl()}</div>`};
/* Recordatorios */
const rrow=r=>{const t=S.tasks.find(x=>x.id==r.tid),late=!r.done&&r.date+r.time<today()+nowT();return `<div class="li"><button class="ck ${r.done?'on':''}" onclick="togRem(${r.id})" aria-label="Completar">${r.done?I('check',16):''}</button><div class="g1"><b class="${r.done?'dn':''}">${E(r.t)}</b><div class="mu" ${late?'style="color:var(--bad)"':''}>${fd(r.date)} ${r.time}${late?' · Atrasado':''}${t?' · Tarea: '+E(t.t):''}</div></div>${r.done?'':`<button class="chip" onclick="snz(${r.id})">Posponer</button>`}<button class="chip" onclick="remForm(${r.id})">Editar</button></div>`};
const remTab=()=>{const n=today()+nowT(),p=S.rems.filter(r=>!r.done).sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1),sec=(t,a)=>a.length?`<h2>${t}</h2><div class="c" style="margin:0 20px 14px;padding:4px 16px">${a.map(rrow).join('')}</div>`:'';return `<div class="row" style="margin:0 20px 10px"><input id="gq" placeholder="Ej.: Recuérdame comprar materiales el viernes" onkeydown="event.key=='Enter'&&rqGo()" aria-label="Pídele a Glow un recordatorio"><button class="b" onclick="rqGo()" aria-label="Interpretar">${I('spark',16)}</button></div><p class="mu" style="margin:0 20px 10px">Glow interpreta tu frase en tu dispositivo y te pregunta lo que no esté claro antes de crear nada.</p><div class="row" style="margin:0 20px"><button class="b b2" style="flex:1" onclick="remForm()">${I('plus',16)} Recordatorio manual</button></div>`+(S.rems.length?sec('Atrasados',p.filter(r=>r.date+r.time<n))+sec('Pendientes',p.filter(r=>r.date+r.time>=n))+sec('Completados',S.rems.filter(r=>r.done).slice(-5).reverse()):`<div style="padding:14px 20px">${empty('bell','Sin recordatorios','Escríbele a Glow una frase o crea uno manualmente.','Nuevo recordatorio','remForm()')}</div>`)};
function notesV(){V.nt=V.nt||'n';return `<div class="chips">${[['n','Notas'],['r','Recordatorios']].map(([k,n])=>`<button class="chip ${V.nt==k?'on':''}" onclick="V.nt='${k}';render()">${n}</button>`).join('')}</div>`+(V.nt=='n'?notesTab():remTab())}
function remForm(id,pre){const r=S.rems.find(x=>x.id==id)||pre||{};sheet(`<h2 style="margin:0">${id?'Editar recordatorio':'Nuevo recordatorio'}</h2><input id="rt" placeholder="¿Qué quieres recordar?" value="${E(r.t||'')}"><div class="f2"><label>Fecha<input id="rd" type="date" value="${r.date||today()}" oninput="this.dataset.d=1"></label><label>Hora<input id="rh" type="time" value="${r.time||''}" oninput="this.dataset.d=1"></label></div><label>Tarea relacionada (opcional)<select id="rk" onchange="remTk(this.value)"><option value="">Ninguna</option>${S.tasks.filter(x=>!x.dn||x.id==r.tid).map(x=>`<option value="${x.id}" ${x.id==r.tid?'selected':''}>${E(x.t)}</option>`).join('')}</select></label><button class="b" onclick="saveRem(${id||0})">Guardar</button>${id?`<button class="b b2" onclick="ask('¿Eliminar este recordatorio?','Eliminar',()=>delRem(${id}))">Eliminar</button>`:''}`)}
function remTk(v){const x=S.tasks.find(k=>k.id==v);if(x){if(x.due&&!$('#rd').dataset.d)$('#rd').value=x.due;if(x.time&&!$('#rh').dataset.d)$('#rh').value=x.time;if(!$('#rt').value)$('#rt').value=x.t}}
function saveRem(id){const t=$('#rt').value.trim(),d=$('#rd').value,h=$('#rh').value;if(!t)return toast('Escribe qué quieres recordar');if(!d||!h)return toast('Elige fecha y hora');const o={t,date:d,time:h,tid:$('#rk').value?+$('#rk').value:''},r=S.rems.find(x=>x.id==id);if(r){if(r.date!=d||r.time!=h){r.rdone='';r.done=''}Object.assign(r,o)}else{const x={id:nid2(S.rems),done:'',...o};S.rems.push(x);emit('reminder.created',{id:x.id})}askNotif();save();shut();render()}
function delRem(id){S.rems=S.rems.filter(x=>x.id!=id);emit('reminder.deleted',{id});save();shut();render()}
function togRem(id){const r=S.rems.find(x=>x.id==id);r.done=r.done?'':today();if(r.done)emit('reminder.done',{id});save();render()}
function snz(id){sheet(`<h2 style="margin:0">Posponer</h2>${[['m10','En 10 minutos'],['h1','En 1 hora'],['d1','Mañana a la misma hora']].map(([k,n])=>`<button class="b b2" onclick="snoze(${id},'${k}')">${n}</button>`).join('')}<button class="chip" onclick="remForm(${id})">Elegir otra fecha y hora…</button>`)}
function snoze(id,k){const r=S.rems.find(x=>x.id==id),d=new Date();if(k=='m10')d.setMinutes(d.getMinutes()+10);else if(k=='h1')d.setHours(d.getHours()+1);else{d.setDate(d.getDate()+1);const[h,m]=r.time.split(':');d.setHours(+h,+m)}r.date=iso(d);r.time=pad(d.getHours())+':'+pad(d.getMinutes());r.done='';r.rdone='';emit('reminder.snoozed',{id});save();shut();render();toast('Pospuesto a '+fd(r.date)+' '+r.time,'ok')}
const chkR2=n=>S.rems.forEach(r=>{if(r.done)return;const k=r.date+r.time,at=new Date(r.date+'T'+r.time).getTime();if(r.rdone!==k&&n>=at&&n<at+216e5){r.rdone=k;save();emit('reminder.fired',{id:r.id});remind({t:r.t,time:r.time})}});
/* Interpretación de lenguaje natural (reglas locales; pregunta cuando algo es ambiguo) */
const WD=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'],WN=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],nrm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function parseRem(raw){let o=raw.trim(),n=nrm(o);const t0=today(),dow=new Date(t0+'T12:00').getDay(),qs=[];let date='',time='',per='';
const cut=re=>{const m=re.exec(n);if(!m)return null;const a=m.index,b=a+m[0].length;n=n.slice(0,a)+' '+n.slice(b);o=o.slice(0,a)+' '+o.slice(b);return m},hh=x=>pad(x)+':00';
cut(/^\s*(por favor\s+)?(recuerdame|recordarme|recordame|avisame|recuerda|recordatorio)\s*(de|para|que)?\s*/);
let m=cut(/\ben\s+(\d+)\s*(minutos?|min|horas?|dias?|semanas?)\b/);if(m){const k=+m[1],u=m[2][0],d=new Date();if(u=='m')d.setMinutes(d.getMinutes()+k);else if(u=='h')d.setHours(d.getHours()+k);else d.setDate(d.getDate()+k*(u=='s'?7:1));date=iso(d);if(u=='m'||u=='h')time=pad(d.getHours())+':'+pad(d.getMinutes())}
else if(m=cut(/\ben\s+(una|media)\s+hora\b/)){const d=new Date();d.setMinutes(d.getMinutes()+(m[1]=='una'?60:30));date=iso(d);time=pad(d.getHours())+':'+pad(d.getMinutes())}
if(m=cut(/\besta\s+(manana|tarde|noche)\b/)){per=m[1];date=date||t0}
const AP='(am|pm|a\\.?\\s?m\\.?|p\\.?\\s?m\\.?)(?![a-z])',PD='(?:\\s+(?:de|por|en)\\s+la\\s+(manana|tarde|noche|madrugada))?';
if(!time)for(const r of [new RegExp('\\ba\\s+las?\\s+(\\d{1,2})(?::(\\d{2}))?(?:\\s*'+AP+')?'+PD),new RegExp('\\b(\\d{1,2}):(\\d{2})(?:\\s*'+AP+')?'+PD),new RegExp('\\b(\\d{1,2})()\\s*'+AP+PD)]){m=cut(r);if(m){let h=+m[1],mi=m[2]?+m[2]:0,ap=m[3]?m[3][0]:'',pr=m[4]||'';if(h>23||mi>59)break;if(ap=='p'&&h<12)h+=12;else if(ap=='a'&&h==12)h=0;else if(!ap&&pr){if((pr=='tarde'||pr=='noche')&&h<12)h+=12;if(pr=='madrugada'&&h==12)h=0}
if(ap||pr||h>=13||h==0)time=pad(h)+':'+pad(mi);else{const f=x=>pad(x)+':'+pad(mi);qs.push({k:'time',q:h==12?`¿A las 12:${pad(mi)} del mediodía o de la medianoche?`:`¿A las ${h}:${pad(mi)} de la mañana o de la tarde/noche?`,opts:h==12?[['Mediodía 12:'+pad(mi),f(12)],['Medianoche 00:'+pad(mi),f(0)]]:[['Por la mañana ('+f(h)+')',f(h)],['Por la tarde/noche ('+f(h+12)+')',f(h+12)]]})}break}}
if(!time&&cut(/\bal\s+mediodia\b/))time='12:00';
if(m=cut(/\b(?:por|en)\s+la\s+(manana|tarde|noche)\b/))per=per||m[1];
if(!date){if(cut(/\bpasado\s+manana\b/))date=ad(t0,2);else if(cut(/\bmanana\b/))date=ad(t0,1);else if(cut(/\bhoy\b/))date=t0;
else if(m=cut(new RegExp('\\b(\\d{1,2})\\s+de\\s+('+MO.join('|').replace('septiembre','septiembre|setiembre')+')\\b'))){const mo=MO.indexOf(m[2]=='setiembre'?'septiembre':m[2]),y=+t0.slice(0,4);let d=new Date(y,mo,+m[1],12);if(d.getMonth()!=mo)qs.push({k:'date',q:'Esa fecha no existe. ¿Qué día es?',opts:[]});else{if(iso(d)<t0)d=new Date(y+1,mo,+m[1],12);date=iso(d)}}
else if(m=cut(/\b(\d{1,2})\/(\d{1,2})\b/)){const y=+t0.slice(0,4);let d=new Date(y,+m[2]-1,+m[1],12);if(d.getMonth()!=+m[2]-1)qs.push({k:'date',q:'Esa fecha no existe. ¿Qué día es?',opts:[]});else{if(iso(d)<t0)d=new Date(y+1,+m[2]-1,+m[1],12);date=iso(d)}}
else if(m=cut(/\b(?:el\s+|este\s+)?(proximo\s+|siguiente\s+)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/)){const wi=WD.indexOf(m[2]),df=(wi-dow+7)%7;if(m[1])date=ad(t0,df||7);else if(df==0)qs.push({k:'date',q:`Hoy es ${WN[wi]}. ¿Te refieres a hoy o al próximo ${WN[wi]}?`,opts:[['Hoy',t0],['Próximo '+WN[wi],ad(t0,7)]]});else date=ad(t0,df)}
else if(cut(/\b(la\s+proxima\s+semana|la\s+semana\s+que\s+viene|proxima\s+semana)\b/)){const mon=ad(t0,(8-dow)%7||7);qs.push({k:'date',q:'¿Qué día de la próxima semana?',opts:[1,2,3,4,5].map(i=>[WN[(i)%7][0].toUpperCase()+WN[i%7].slice(1)+' '+fd(ad(mon,i-1)),ad(mon,i-1)])})}
else if(m=cut(/\bel\s+(\d{1,2})\b/)){const dd=+m[1],y=+t0.slice(0,4),mo=+t0.slice(5,7)-1;let d=new Date(y,mo,dd,12);if(dd<1||dd>31||d.getMonth()!=mo||iso(d)<t0)d=new Date(y,mo+1,dd,12);date=iso(d)}}
o=o.replace(/\s+/g,' ').trim();for(let i=0;i<4;i++)o=o.replace(/^(que|de|para)\s+/i,'').replace(/\s+(el|la|a|de|para|que|este|esta|en|por|y|al|las?)$/i,'').trim();const t=o?o[0].toUpperCase()+o.slice(1):'';
if(!t)qs.push({k:'t',q:'¿Qué quieres que te recuerde?'});if(!date&&!qs.some(q=>q.k=='date'))qs.push({k:'date',q:'¿Qué día?',opts:[['Hoy',t0],['Mañana',ad(t0,1)]]});
if(!time&&!qs.some(q=>q.k=='time'))qs.push({k:'time',q:per?`¿A qué hora de la ${per}?`:'¿A qué hora?',opts:per=='manana'?[8,9,10,11].map(h=>[hh(h),hh(h)]):per=='tarde'?[14,15,16,17].map(h=>[hh(h),hh(h)]):per=='noche'?[19,20,21,22].map(h=>[hh(h),hh(h)]):[['Mañana 09:00','09:00'],['Mediodía 12:00','12:00'],['Tarde 15:00','15:00'],['Noche 20:00','20:00']]});
const k=t&&t.length>=4?S.tasks.find(x=>!x.dn&&(nrm(x.t).includes(nrm(t))||nrm(t).includes(nrm(x.t)))):null;
return{o:raw.trim(),t,date,time,qs,tid:k?k.id:''}}
function rqGo(){const v=$('#gq').value.trim();if(!v)return toast('Escribe qué quieres recordar');window.RQ=parseRem(v);rqShow()}
function rqSet(k,v){RQ[k]=v;rqShow()}
function rqShow(){const r=RQ,ok=r.t.trim()&&r.date&&r.time,qs=r.qs.filter(q=>!r[q.k]);sheet(`<h2 style="margin:0">${I('spark',18)} Glow entendió</h2><p class="mu">«${E(r.o)}»</p>${qs.map(q=>`<div><b>${E(q.q)}</b><div class="chips" style="padding:6px 0">${(q.opts||[]).map(([l,v])=>`<button class="chip" onclick="rqSet('${q.k}','${v}')">${E(l)}</button>`).join('')}</div></div>`).join('')}<label>Recordar<input value="${E(r.t)}" oninput="RQ.t=this.value;$('#rqb').disabled=!(RQ.t.trim()&&RQ.date&&RQ.time)"></label><div class="f2"><label>Fecha<input type="date" value="${r.date}" onchange="rqSet('date',this.value)"></label><label>Hora<input type="time" value="${r.time}" onchange="rqSet('time',this.value)"></label></div><label>Tarea relacionada (opcional)<select onchange="RQ.tid=this.value?+this.value:''"><option value="">Ninguna</option>${S.tasks.filter(x=>!x.dn).map(x=>`<option value="${x.id}" ${x.id==r.tid?'selected':''}>${E(x.t)}</option>`).join('')}</select></label><p class="mu">${ok?'Todo listo. Solo se crea cuando confirmes.':'Falta información: responde las preguntas o completa los campos.'}</p><div class="row"><button class="b b2" style="flex:1" onclick="shut()">Cancelar</button><button id="rqb" class="b" style="flex:1" ${ok?'':'disabled'} onclick="rqCreate()">Crear</button></div>`)}
function rqCreate(){const r=RQ;if(!(r.t.trim()&&r.date&&r.time))return;const x={id:nid2(S.rems),t:r.t.trim(),date:r.date,time:r.time,tid:r.tid,done:''};S.rems.push(x);emit('reminder.created',{id:x.id,src:'glow'});askNotif();save();shut();render();toast('Recordatorio creado: '+fd(x.date)+' '+x.time,'ok')}
ap();
render();
</script></body></html>
