/* ===== Actualizaciones inteligentes de GlowLife ===== */

if ('serviceWorker' in navigator) {

  let refreshing = false;
  let waitingWorker = null;

  // Crear aviso de actualización
  const updateBox = document.createElement('div');

  updateBox.id = 'gl-update-box';

  updateBox.innerHTML = `
    <div style="
      position:fixed;
      left:16px;
      right:16px;
      bottom:100px;
      z-index:9999;
      max-width:520px;
      margin:auto;
      padding:16px;
      border-radius:18px;
      background:#ffffff;
      color:#3b2d78;
      box-shadow:0 8px 30px rgba(0,0,0,.18);
      border:1px solid #d9ccfa;
      font-family:system-ui,sans-serif;
    ">
      <div style="font-weight:700;font-size:15px">
        ✨ ¡GlowLife tiene una nueva versión!
      </div>

      <p style="font-size:13px;margin:7px 0 12px">
        Hay mejoras disponibles para tu aplicación.
      </p>

      <button id="gl-update-button" style="
        width:100%;
        padding:12px;
        border:0;
        border-radius:10px;
        background:#9d8ae8;
        color:white;
        font-weight:700;
        font-size:14px;
      ">
        Actualizar ahora
      </button>

      <button id="gl-update-later" style="
        width:100%;
        padding:9px;
        margin-top:5px;
        border:0;
        background:transparent;
        color:#7a7390;
      ">
        Más tarde
      </button>
    </div>
  `;

  document.body.appendChild(updateBox);
  updateBox.style.display = 'none';

  function showUpdate(worker) {
    waitingWorker = worker;
    updateBox.style.display = 'block';
  }

  // Aceptar actualización
  document.getElementById('gl-update-button')
    .addEventListener('click', () => {

      if (waitingWorker) {
        waitingWorker.postMessage('SKIP_WAITING');
      }
    });

  // Posponer actualización
  document.getElementById('gl-update-later')
    .addEventListener('click', () => {
      updateBox.style.display = 'none';
    });

  // Recargar cuando la nueva versión tome el control
  navigator.serviceWorker.addEventListener(
    'controllerchange',
    () => {
      if (refreshing) return;

      refreshing = true;
      window.location.reload();
    }
  );

  // Registrar aplicación
  navigator.serviceWorker.register('./sw.js', {
    updateViaCache: 'none'
  }).then(registration => {

    // Comprobar si ya hay una actualización esperando
    if (registration.waiting &&
        navigator.serviceWorker.controller) {
      showUpdate(registration.waiting);
    }

    // Detectar nuevas versiones
    registration.addEventListener('updatefound', () => {

      const newWorker = registration.installing;

      if (!newWorker) return;

      newWorker.addEventListener('statechange', () => {

        if (
          newWorker.state === 'installed' &&
          navigator.serviceWorker.controller
        ) {
          showUpdate(newWorker);
        }
      });
    });

    // Buscar actualizaciones
    registration.update().catch(() => {});

    // Revisar al volver a la aplicación
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        registration.update().catch(() => {});
      }
    });

    // Revisar al recuperar conexión
    window.addEventListener('online', () => {
      registration.update().catch(() => {});
    });

  }).catch(error => {
    console.error('Error al registrar GlowLife:', error);
  });
}

if(x){pke(x,-1);Object.assign(x,o);pke(x,1)}else{o.id=nxt();o.h=pad(n.getHours())+':'+pad(n.getMinutes());S.tx.push(o);pke(o,1)}
S.tx.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id);save();shut();render();if(TT=='g'&&o.c){const b=bst(o.c,d.slice(0,7));if(b.st=='over'||b.st=='near')toast('Presupuesto de '+cn(o.c)+': '+b.p+'%')}}
function delTx(id){const x=S.tx.find(k=>k.id==id);if(!x)return;pke(x,-1);S.tx=S.tx.filter(k=>k.id!=id);save();shut();render()}
function pkForm(id){const p=S.pockets.find(k=>k.id==id)||{};sheet(`<h2 style="margin:0">${id?'Editar objetivo de ahorro':'Nuevo objetivo de ahorro'}</h2><input id="pn" placeholder="Nombre (ej. Viaje a Kioto)" value="${E(p.n||'')}"><label>Ícono<select id="pi">${PO.map(o=>`<option value="${o[0]}" ${o[0]==p.i?'selected':''}>${o[1]}</option>`).join('')}</select></label><label>Meta de ahorro<input id="pg" type="number" inputmode="decimal" min="0" value="${p.g||''}"></label><button class="b" onclick="savePk(${id||0})">Guardar</button>${id?`<button class="b b2" onclick="ask('¿Eliminar este objetivo? Tus movimientos se conservan.','Eliminar',()=>delPk(${id}))">Eliminar</button>`:''}`)}
function savePk(id){const n=$('#pn').value.trim();if(!n)return toast('Ponle un nombre');if(S.pockets.some(k=>k.n==n&&k.id!=id))return toast('Ya existe uno con ese nombre');const p=S.pockets.find(k=>k.id==id),g=r2(parseFloat($('#pg').value)||0);if(p){S.tx.forEach(x=>{if(x.p==p.n)x.p=n});Object.assign(p,{n,i:$('#pi').value,g})}else S.pockets.push({id:Date.now(),n,i:$('#pi').value,g,v:0});save();shut();render()}
function delPk(id){const p=S.pockets.find(k=>k.id==id);S.tx.forEach(x=>{if(x.p==p.n)x.p=''});S.pockets=S.pockets.filter(k=>k.id!=id);save();shut();render()}
function catForm(){sheet(`<h2 style="margin:0">Categorías</h2>${['g','i'].map(t=>`<b>${t=='g'?'Gastos':'Ingresos'}</b>${S.cats.filter(c=>c.t==t).map(c=>`<div class="li"><b class="g1">${E(c.n)}</b><button class="chip" onclick="ask('¿Eliminar esta categoría? Sus movimientos pasan a «Sin categoría».','Eliminar',()=>{delCat(${c.id});catForm()})">Eliminar</button></div>`).join('')}`).join('')}<div class="row"><input id="cnm" placeholder="Nueva categoría" maxlength="24"><select id="cty" style="width:auto"><option value="g">Gasto</option><option value="i">Ingreso</option></select></div><button class="b" onclick="addCat()">Agregar categoría</button>`)}
function addCat(){const n=$('#cnm').value.trim(),t=$('#cty').value;if(!n)return toast('Escribe el nombre');if(S.cats.some(c=>c.t==t&&c.n.toLowerCase()==n.toLowerCase()))return toast('Esa categoría ya existe');S.cats.push({id:Math.max(0,...S.cats.map(c=>c.id))+1,n,t});save();render();catForm()}
function delCat(id){S.tx.forEach(x=>{if(x.c==id)x.c=''});delete S.bud[id];S.cats=S.cats.filter(c=>c.id!=id);save();render()}
function setBud(c,v){v=r2(parseFloat(v));if(v>0)S.bud[c]=v;else delete S.bud[c];save();render()}
const mon6=()=>{const a=[],d=new Date();for(let i=5;i>=0;i--){const e=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(e.getFullYear()+'-'+pad(e.getMonth()+1))}return a},ml=m=>new Date(m+'-01T12:00').toLocaleDateString('es',{month:'short'}),mL=m=>new Date(m+'-01T12:00').toLocaleDateString('es',{month:'long',year:'numeric'}),m12=()=>{const a=[],d=new Date();for(let i=0;i<12;i++){const e=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(e.getFullYear()+'-'+pad(e.getMonth()+1))}return a};
const mrow=x=>`<div class="c it row sp" style="cursor:pointer" onclick="txForm(${x.id})"><div class="g1"><b>${E(x.n)}</b><div class="mu">${fd(x.d)} · ${E(cn(x.c))}${x.p?' · '+E(x.p):''}</div></div><b style="color:${x.t=='i'?'var(--ok)':'var(--bad)'}">${x.t=='i'?'+':'−'}${$m(x.a)}</b></div>`;
const mlist=()=>{const f=V.mf||{},l=S.tx.filter(x=>(!f.f||x.d>=f.f)&&(!f.to||x.d<=f.to)&&(!f.t||x.t==f.t)&&(!f.c||(f.c=='0'?!x.c:x.c==f.c))),i=sum(l.filter(x=>x.t=='i').map(x=>x.a)),g=sum(l.filter(x=>x.t=='g').map(x=>x.a));return `<div class="g3" style="margin-bottom:10px">${mini($m(i),'Ingresos')}${mini($m(g),'Gastos')}${mini($m(r2(i-g)),'Neto')}</div>`+(l.map(mrow).join('')||'<p class="mu">Sin movimientos con estos filtros.</p>')};
const fRes=()=>{const m=MS(),i=msum(m,'i'),g=msum(m,'g'),al=bals();return `<div class="c"><div class="mu">Saldo disponible</div><div class="big">${$m(fsaldo())}</div><p class="mu">Ingresos menos gastos registrados. No se conecta a ningún banco.</p></div><div class="g3" style="margin:0 20px 14px">${mini($m(i),'Ingresos del mes')}${mini($m(g),'Gastos del mes')}${mini($m(r2(i-g)),'Neto del mes')}</div>${al.map(a=>`<div class="c" style="border-left:5px solid ${a.st=='over'?'var(--bad)':'#F5B94A'}"><b>${a.st=='over'?'Superaste':'Cerca del límite en'} ${E(cn(a.c))}</b><div class="mu">${$m(a.s)} de ${$m(a.l)} (${a.p}%)</div></div>`).join('')}<div class="row sp" style="margin:0 20px"><h2 style="margin:14px 0 10px">Objetivos de ahorro</h2><button class="chip" onclick="pkForm()">${I('plus',14)} Nuevo</button></div>${S.pockets.map(p=>`<div class="c" style="cursor:pointer" onclick="pkForm(${p.id})"><div class="row sp"><div class="row"><span class="ic">${I(pi(p))}</span><div><b>${E(p.n)}</b><div class="mu">${pc(p)}% de la meta</div></div></div><div style="text-align:right"><b>${$m(p.v)}</b><div class="mu">de ${$m(p.g)}</div></div></div><div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,pc(p))}%"></i></div></div>`).join('')||'<p class="mu" style="margin:0 20px">Aún no tienes objetivos de ahorro.</p>'}<h2>Recientes</h2><div style="padding:0 20px">${S.tx.slice(0,5).map(mrow).join('')||empty('wallet','Sin movimientos','Registra tu primer ingreso o gasto.','Nuevo gasto','txForm(0,\'g\')')}</div>`};
const fMov=()=>{V.mf=V.mf||{};const f=V.mf,u=`V.mf.`;return `<div class="f2" style="margin:0 20px 10px"><label>Desde<input type="date" value="${f.f||''}" onchange="V.mf.f=this.value;$('#mlist').innerHTML=mlist()"></label><label>Hasta<input type="date" value="${f.to||''}" onchange="V.mf.to=this.value;$('#mlist').innerHTML=mlist()"></label></div><div class="row" style="margin:0 20px 10px"><select aria-label="Tipo" onchange="V.mf.t=this.value;$('#mlist').innerHTML=mlist()">${op([['','Todos los tipos'],['i','Ingresos'],['g','Gastos']],f.t||'')}</select><select aria-label="Categoría" onchange="V.mf.c=this.value;$('#mlist').innerHTML=mlist()">${op([['','Todas las categorías'],['0','Sin categoría'],...S.cats.map(c=>[c.id,c.n])],f.c||'')}</select></div><div id="mlist" style="padding:0 20px">${mlist()}</div>`};
const fPre=()=>{const m=MS();return `<div class="row sp" style="margin:0 20px 8px"><h2 style="margin:0">Presupuesto de ${mL(m)}</h2><button class="chip" onclick="catForm()">Categorías</button></div><p class="mu" style="margin:0 20px 10px">Define un límite mensual por categoría de gasto. Te avisamos al llegar al 80% y al superarlo.</p>${S.cats.filter(c=>c.t=='g').map(c=>{const b=bst(c.id);return `<div class="c"><div class="row sp"><b>${E(c.n)}</b><input type="number" inputmode="decimal" min="0" placeholder="Sin límite" value="${b.l||''}" style="width:130px" aria-label="Límite de ${E(c.n)}" onchange="setBud(${c.id},this.value)"></div>${b.l?`<div class="bar" style="margin:10px 0 4px"><i class="${b.st}" style="width:${Math.min(100,b.p)}%"></i></div><div class="mu" style="color:${b.st=='over'?'var(--bad)':'var(--mu)'}">${$m(b.s)} de ${$m(b.l)} · ${b.p}%${b.st=='over'?' · Superado':b.st=='near'?' · Cerca del límite':''}</div>`:`<div class="mu">Gastado este mes: ${$m(b.s)}</div>`}</div>`}).join('')}`};
const fAna=()=>{const ms=mon6(),d=ms.map(m=>({m,i:msum(m,'i'),g:msum(m,'g'),b:sum(S.tx.filter(x=>x.d.slice(0,7)<=m).map(x=>x.t=='i'?x.a:-x.a))})),mx=Math.max(1,...d.map(x=>Math.max(x.i,x.g))),bn=Math.min(0,...d.map(x=>x.b)),bm=Math.max(1,...d.map(x=>x.b)),X=i=>30+i*52,H=v=>Math.round(v/mx*100),Y=v=>150-Math.round((v-bn)/(bm-bn)*100);
const A=V.ca||MS(),B=V.cb||m12()[1],cs=[...new Set(S.tx.filter(x=>x.t=='g'&&(x.d.slice(0,7)==A||x.d.slice(0,7)==B)).map(x=>x.c))],cur=MS(),cg=S.cats.filter(c=>c.t=='g').map(c=>[c.n,spent(cur,c.id)]).concat([['Sin categoría',sum(mtx(cur,'g').filter(x=>!x.c).map(x=>x.a))]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),tg=msum(cur,'g'),dl=(a,b)=>{const v=r2(a-b);return (v>0?'+':v<0?'−':'')+$m(Math.abs(v))},tr=(n,a,b)=>`<tr><td>${n}</td><td>${$m(a)}</td><td>${$m(b)}</td><td>${dl(a,b)}</td></tr>`;
return `<div class="c"><b>Ingresos y gastos (6 meses)</b><svg viewBox="0 0 340 175" width="100%" role="img" aria-label="Ingresos y gastos por mes">${d.map((x,k)=>`<rect x="${X(k)-12}" y="${100-H(x.i)+20}" width="11" height="${H(x.i)}" rx="3" fill="var(--pri)"/><rect x="${X(k)}" y="${100-H(x.g)+20}" width="11" height="${H(x.g)}" rx="3" fill="var(--bad)"/><text x="${X(k)}" y="148" text-anchor="middle" font-size="11" fill="var(--mu)">${ml(x.m)}</text>`).join('')}<text x="30" y="14" font-size="10" fill="var(--pri)">■ Ingresos</text><text x="110" y="14" font-size="10" fill="var(--bad)">■ Gastos</text></svg></div>
<div class="c"><b>Evolución del saldo</b><svg viewBox="0 0 340 175" width="100%" role="img" aria-label="Evolución del saldo"><polyline fill="none" stroke="var(--vio)" stroke-width="3" points="${d.map((x,k)=>X(k)+','+(Y(x.b)-10)).join(' ')}"/>${d.map((x,k)=>`<circle cx="${X(k)}" cy="${Y(x.b)-10}" r="4" fill="var(--pri)"/><text x="${X(k)}" y="${Y(x.b)-20}" text-anchor="middle" font-size="9" fill="var(--mu)">${$m(x.b).replace(',00','')}</text><text x="${X(k)}" y="168" text-anchor="middle" font-size="11" fill="var(--mu)">${ml(x.m)}</text>`).join('')}</svg></div>
<div class="c"><b>Gastos por categoría · ${mL(cur)}</b>${cg.map(([n,v])=>`<div style="margin-top:10px"><div class="row sp"><span>${E(n)}</span><b>${$m(v)} · ${Math.round(v/tg*100)}%</b></div><div class="bar"><i style="width:${Math.round(v/tg*100)}%"></i></div></div>`).join('')||'<p class="mu">Aún no hay gastos este mes.</p>'}</div>
<div class="c"><b>Comparar meses</b><div class="f2" style="margin-top:8px"><label>Mes A<select onchange="V.ca=this.value;render()">${op(m12().map(m=>[m,mL(m)]),A)}</select></label><label>Mes B<select onchange="V.cb=this.value;render()">${op(m12().map(m=>[m,mL(m)]),B)}</select></label></div><table class="tb"><tr><th></th><th>${ml(A)}</th><th>${ml(B)}</th><th>Dif.</th></tr>${tr('Ingresos',msum(A,'i'),msum(B,'i'))}${tr('Gastos',msum(A,'g'),msum(B,'g'))}${tr('Neto',r2(msum(A,'i')-msum(A,'g')),r2(msum(B,'i')-msum(B,'g')))}${cs.map(c=>tr(E(cn(c)),spent(A,c),spent(B,c))).join('')}</table></div>`};
function fin(){V.ft=V.ft||'res';return `<div class="row" style="margin:0 20px 12px"><button class="b" style="flex:1" onclick="txForm(0,'i')">${I('plus',16)} Ingreso</button><button class="b b2" style="flex:1" onclick="txForm(0,'g')">${I('plus',16)} Gasto</button></div><div class="chips">${[['res','Resumen'],['mov','Movimientos'],['pre','Presupuestos'],['ana','Análisis']].map(([k,n])=>`<button class="chip ${V.ft==k?'on':''}" onclick="V.ft='${k}';render()">${n}</button>`).join('')}</div>`+({res:fRes,mov:fMov,pre:fPre,ana:fAna}[V.ft])()}
ap();
render();
</script></body></html>
