:root{--bg:#fff;--card:#fff;--well:#faf6ff;--bd:#eadff7;--pri:#7b68c8;--sec:#c8b3f0;--tx:#2d2540;--mu:#7a7390;--onp:#fff;--sh:0 1px 3px rgba(123,104,200,.08);color-scheme:light}

.chip{border-radius:8px}input,select{border-radius:10px}.sb{border-radius:20px 20px 0 0}.bar,.bar i{border-radius:4px}.bar i{background:linear-gradient(90deg,#cdbdf5,#9d8ae8)}.c:hover{box-shadow:0 8px 24px -10px rgba(0,0,0,.2)}

.ck{color:#3b2d78}.ck.on{background:#cdbdf5;border-color:#b5a2ee}

</style></head><body><div id="app"></div><div id="sh"></div><div id="ts"></div>
<script>
const K='glowlife_v1',$=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),pad=n=>String(n).padStart(2,'0');
const $m=n=>'$'+Number(n).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2}),fd=d=>new Date(d+'T12:00').toLocaleDateString('es',{day:'numeric',month:'short'});
const DQ=['Todo lo que sueñas está esperando que te organices para recibirlo con calma y constancia.','Un paso suave a la vez crea el camino que sueñas hoy.','Me permito florecer a mi propio ritmo sin compararme con los jardines ajenos.','Mi valor no disminuye por cometer errores; cada tropiezo refina mi brillo.','Lo que es para mí, me encuentra en paz.'];
const P={house:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',wallet:'<path d="M3 7a2 2 0 012-2h13v4M3 7v11a2 2 0 002 2h15V9H5a2 2 0 01-2-2zM16 14.5h2"/>',tasks:'<path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',flame:'<path d="M12 22c4 0 7-2.8 7-6.5 0-3-2-5-3.5-7-.5 2.5-2 3-2.5 2.500.5-3-1-6-3-8 0 4-5 6-5 12.500C5 19.200 8 22 12 22z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM12 9v6M9 12h6"/>',plane:'<path d="M21 3L3 10.500l6.500 2.500L12 20l2.500-5.500zM9.500 13L21 3"/>',cap:'<path d="M2 9l10-5 10 5-10 5zM6 11.500V16c0 1.500 3 3 6 3s6-1.500 6-3v-4.500M22 9v6"/>',heart:'<path d="M12 20s-8-5-8-11a4.500 4.500 0 018-2.800A4.500 4.500 0 0120 9c0 6-8 11-8 11z"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8S10 3 7.500 4.500 9 8 12 8zm0 0s2-5 4.500-3.500S15 8 12 8z"/>',star:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100-5.400-2.900-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5M8 7h7"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.500l4.500 4.500L19 7.500"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',refresh:'<path d="M20 11a8 8 0 10-2.300 5.700M20 4v7h-7"/>',cl:'<path d="M15 5l-7 7 7 7"/>',cr:'<path d="M9 5l7 7-7 7"/>'};
const I=(n,s=22,f)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||P.heart}</svg>`,pi=p=>P[p.i]?p.i:({1:'shield',2:'plane',3:'cap'}[p.id]||'heart'),PO=[['shield','Emergencia'],['plane','Viaje'],['cap','Estudios'],['house','Hogar'],['gift','Regalo'],['book','Libros'],['star','Sueño'],['heart','Bienestar']];
const TAGS=['Universidad','Metas','Fitness'],CATS=['Universidad','Finanzas','Fitness','Meta personal'],DN=['L','M','X','J','V','S','D'],HB=['2 L de agua','10k pasos','Estiramiento'];
const def=()=>({name:'',tab:'home',pockets:[{id:1,n:'Fondo de Emergencia',i:'shield',g:2500,v:0},{id:2,n:'Ahorro a Futuro',i:'plane',g:3000,v:0},{id:3,n:'Gastos & Universidad',i:'cap',g:1000,v:0}],tx:[],tasks:[],events:[],h:{d:'',a:[0,0,0]},focus:{},act:{},q:[],fav:[],vb:[],goals:[],pm:25,habits:[]});
let S,T={left:1500,end:0,id:0},V={wo:0,mo:0,sel:today(),ct:'w',f:'Todas'},ok=true;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){ok=false}S=Object.assign(def(),S||{});
const save=()=>{S.act[today()]=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false;toast('Este navegador no permite guardar')}mirror()};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class="bk" onclick="shut()"></div><div class="sb">'+h+'</div>';$('#sh').className='on'}
function shut(){clearInterval(AL);$('#sh').className='';$('#sh').innerHTML=''}
const streak=()=>{let n=0,d=new Date();if(!S.act[iso(d)])d.setDate(d.getDate()-1);while(S.act[iso(d)]){n++;d.setDate(d.getDate()-1)}return n};
const pc=p=>p.g?Math.min(100,Math.round(p.v/p.g*100)):0,pend=()=>S.tasks.filter(x=>!x.dn).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1),byT=(a,b)=>a.time>b.time?1:-1;
const ring=(p,t,i)=>`<svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--well)" stroke-width="8"/><circle id="${i}g" cx="50" cy="50" r="45" fill="none" stroke="var(--pri)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2.83*p} 283" transform="rotate(-90 50 50)"/><text id="${i}t" x="50" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="var(--pri)">${t}</text></svg>`;
const row=(r,t,s,on,fn,c)=>`<div class="c it row" ${c?`style="border-left:5px solid ${c}"`:''}><button class="ck ${on?'on':''}" ${on&&c?`style="background:${c};border-color:${c}"`:''} onclick="${fn}">${on?I('check',16):''}</button><div style="flex:1"><b class="${on?'dn':''}">${t}</b><div class="mu">${s}</div></div><span class="mu">${r}</span></div>`;
const hb=()=>{if(S.h.d!=today())S.h={d:today(),a:[0,0,0]};return S.h.a};

function render(){if(!S.name)return onb();const v={home,fin:finG,goals:goalsV,life,cal,insp}[S.tab]();
const N=[['home','Inicio','house'],['fin','Finanzas','wallet'],['goals','Metas','star'],['life','Tareas','tasks'],['cal','Calendario','cal'],['insp','Inspiración','spark']];
$('#app').innerHTML=`<header><div><b>GlowLife</b></div><div class="row"><span class="chip">${I('flame',14)} ${streak()}d</span><button class="ic b2" style="border:1px solid var(--bd);cursor:pointer;font:700 16px inherit;color:var(--pri)" onclick="prof()" aria-label="Perfil">${E(S.name[0].toUpperCase())}</button></div></header><main>${v}</main><nav>${N.map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="S.tab='${n[0]}';save();render();scrollTo(0,0)"><span>${I(n[2])}</span>${n[1]}</button>`).join('')}</nav>`;document.querySelectorAll('.fab').forEach(b=>b.innerHTML=I('plus',26));if(S.tab=='insp')loadM()}
function onb(){$('#app').innerHTML=`<div class="ob"><div style="color:var(--sec);display:grid;place-items:center">${I('spark',64)}</div><h1>GlowLife</h1><p class="mu" style="font-size:14px">Tu espacio para organizar finanzas, estudio y metas.</p><input id="nm" placeholder="¿Cómo te llamas?" maxlength="30" autocomplete="given-name"><button class="b" onclick="go()">Comenzar</button><p class="mu">${ok?'Tus datos se guardan en este dispositivo.':'Aviso: este navegador no permite guardar datos.'}</p></div>`}
function go(){const n=$('#nm').value.trim();if(!n)return toast('Escribe tu nombre');S.name=n;save();render()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&document.activeElement.id=='nm')go()});

function home(){const a=hb(),p=pend()[0],lo=S.pockets.slice().sort((x,y)=>pc(x)-pc(y))[0],tot=S.pockets.reduce((s,x)=>s+x.v,0);
const adv=p?`Tienes <b>${E(p.t)}</b> pendiente${p.due?' para el '+fd(p.due):''}. Dedica un bloque de 25 min hoy.`:lo?`Tu bolsillo <b>${E(lo.n)}</b> va en ${pc(lo)}%. ¿Reservas algo hoy?`:'Agrega tu primera tarea para organizar tu día.';
const ev=S.events.filter(e=>e.date==today()).sort(byT).map(e=>row(e.time,E(e.t),e.cat,e.done,`te(${e.id})`,gcl(e.g))),tk=pend().slice(0,4).map(t=>row(t.due?fd(t.due):'',E(t.t),t.tag,0,`tt(${t.id})`,gcl(t.g))),n=ev.length+tk.length,pr=Math.round(a.reduce((s,x)=>s+x,0)/3*100);
return `<div style="padding:0 20px 12px"><div class="mu">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</div><h1 style="font-size:28px">¡Hola, ${E(S.name)}!</h1><div class="mu" style="font-size:14px">Hoy es ${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}. Esto es lo que tienes que hacer:</div></div>
${hoy()}${tools()}<div class="c" style="background:linear-gradient(135deg,var(--card),var(--well))"><div class="row"><span class="ic">${I('spark')}</span><div><b>GlowBot</b> <span class="chip">Consejo</span><div style="margin-top:4px">${adv}</div></div></div><div class="row" style="margin-top:12px"><button class="b" style="flex:1" onclick="S.tab='life';render()">Aceptar sugerencia</button></div></div>
<div class="c"><div class="row sp"><span class="mu">Balance total disponible</span><button class="chip" onclick="txForm()" aria-label="Nueva transacción">${I('plus',16)}</button></div><div class="big">${UN?$m(tot):'$ ••••'}</div><div class="g3" style="margin-top:10px">${S.pockets.slice(0,3).map(x=>`<div class="ic" style="width:auto;height:auto;border-radius:16px;padding:8px;display:block"><span class="mu">${E(x.n.split(' ')[0])}</span><b>${pc(x)}%</b></div>`).join('')}</div></div>


<div class="c" style="background:var(--well)"><i>“${E(qs()[new Date().getDate()%qs().length].t)}”</i></div>`}
const th=i=>{hb()[i]^=1;save();render()},te=id=>{const e=S.events.find(x=>x.id==id);e.done=!e.done;save();render()},tt=id=>{const x=S.tasks.find(x=>x.id==id);x.dn=x.dn?'':today();save();render()};

function fin(){const tot=S.pockets.reduce((s,x)=>s+x.v,0);

/* ===== Guardado seguro: copia en IndexedDB + almacenamiento persistente ===== */
const mirror=()=>{try{mput('state',JSON.stringify(S)).catch(()=>{})}catch(e){}},persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}mirror()};
if(!S.name)mget('state').then(j=>{if(!j)return;try{S=Object.assign(def(),JSON.parse(j));T.left=S.pm*60;try{localStorage.setItem(K,j)}catch(e){}render()}catch(e){}});
try{navigator.storage.persist()}catch(e){}addEventListener('pagehide',persist);
/* ===== Hábitos propios, rachas y checklist de hoy ===== */
const sched=(h,d)=>!h.days.length||h.days.includes((d.getDay()+6)%7),hs=h=>{let n=0,d=new Date();for(let i=0;i<400;i++,d.setDate(d.getDate()-1)){if(!sched(h,d))continue;if(h.log[iso(d)])n++;else if(i)break}return n};
const th2=id=>{const h=S.habits.find(x=>x.id==id),k=today();h.log[k]?delete h.log[k]:h.log[k]=1;save();render()};
const hoy=()=>{const t=today(),it=[...S.habits.filter(h=>sched(h,new Date())).map(h=>({d:!!h.log[t],f:`th2(${h.id})`,t:h.t,s:'Hábito · racha '+hs(h)+' d',c:h.c})),...S.tasks.filter(x=>x.due&&x.due<=t&&(!x.dn||x.dn==t)).map(x=>({d:!!x.dn,f:`tt(${x.id})`,t:x.t,s:(x.due<t?'Atrasada · ':'Tarea · ')+(gnm(x.g)||'Sin meta'),c:gcl(x.g)})),...S.events.filter(e=>e.date==t).sort(byT).map(e=>({d:!!e.done,f:`te(${e.id})`,t:e.t,s:'Evento · '+e.time,c:gcl(e.g)}))],n=it.filter(x=>x.d).length;
return `<div class="row sp" style="margin:0 20px 8px"><b style="font-size:18px">Checklist de hoy</b><span class="chip on">${n} de ${it.length}</span></div><div class="bar" style="margin:0 20px 12px"><i style="width:${it.length?n/it.length*100:0}%"></i></div>${it.map(x=>row('',E(x.t),x.s,x.d,x.f,x.c)).join('')||'<p class="mu" style="margin:0 20px 12px">Nada programado hoy. Crea un hábito, una tarea con fecha de hoy o un evento.</p>'}${it.length&&n==it.length?'<p style="text-align:center;font-weight:600;color:var(--pri);margin-bottom:10px">¡Día completo!</p>':''}<div class="row" style="margin:0 20px 14px"><button class="b b2" style="flex:1" onclick="habForm()">${I('plus',16)} Hábito</button><button class="b b2" style="flex:1" onclick="tkForm()">${I('plus',16)} Tarea</button></div>`};
const habList=()=>`<div class="row sp" style="margin:16px 20px 8px"><b style="font-size:18px;color:var(--pri)">Mis hábitos</b><button class="b" onclick="habForm()">${I('plus',16)} Nuevo</button></div>`+(S.habits.map(h=>`<div class="c it row sp" style="border-left:5px solid ${h.c}"><div><b>${E(h.t)}</b><div class="mu">${h.days.length?h.days.map(i=>DN[i]).join(' '):'Todos los días'} · racha ${hs(h)} d</div></div><button class="chip" onclick="dh(${h.id})">Eliminar</button></div>`).join('')||'<p class="mu" style="margin:0 20px">Crea hábitos que se repiten, como estirar o leer, y aparecerán en tu checklist de hoy.</p>');
function habForm(){sheet(`<h2 style="margin:0">Nuevo hábito</h2><input id="ht" placeholder="Ej. Estirar 10 min"><span class="mu">Color</span>${sws()}<span class="mu">Se repite</span><div class="chips" style="padding:0">${DN.map((d,i)=>`<button class="chip on" data-d="${i}" onclick="this.classList.toggle('on')">${d}</button>`).join('')}</div><button class="b" onclick="saveHab()">Guardar hábito</button>`)}
function saveHab(){const t=$('#ht').value.trim(),d=[...document.querySelectorAll('#sh .chips .chip.on')].map(x=>+x.dataset.d);if(!t)return toast('Ponle nombre al hábito');if(!d.length)return toast('Elige al menos un día');S.habits.push({id:Date.now(),t,c:$('#sh .sw .on').dataset.c,days:d.length==7?[]:d,log:{}});save();shut();render()}
function dh(id){if(confirm('¿Eliminar este hábito?')){S.habits=S.habits.filter(h=>h.id!=id);save();render()}}
const sws=c=>`<div class="sw">${GC.map((x,i)=>`<button class="${(c?x==c:!i)?'on':''}" style="background:${x}" data-c="${x}" onclick="pc2(this)" aria-label="Color ${i+1}"></button>`).join('')}</div>`;
function glForm(id){const g=S.goals.find(x=>x.id==id)||{};sheet(`<h2 style="margin:0">${id?'Editar meta':'Nueva meta'}</h2><input id="gt" placeholder="¿Qué meta quieres lograr?" value="${E(g.t||'')}"><span class="mu">Color</span>${sws(g.c)}<span class="mu">Fecha objetivo (opcional)</span><input id="gd" type="date" value="${g.due||''}"><button class="b" onclick="saveGl(${id||0})">Guardar meta</button>`)}
function saveGl(id){const t=$('#gt').value.trim();if(!t)return toast('Ponle nombre a tu meta');const o={t,c:$('#sh .sw .on').dataset.c,due:$('#gd').value},g=S.goals.find(x=>x.id==id);g?Object.assign(g,o):S.goals.push({id:Date.now(),...o});save();shut();render()}
/* ===== Inicio interactivo: carrusel de herramientas ===== */
P.timer='<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.500 1.500M9 2h6"/>';
const TL=[['goals','Metas','star','#ffd1e0','#f4a6c1','Crea metas con color y mira tu progreso.',()=>S.goals.length+' creadas'],['life','Tareas','tasks','#cfe3ff','#a9c8f5','Enlaza cada tarea a una meta.',()=>pend().length+' pendientes'],['life','Enfoque','timer','#e4d8ff','#c8b3f0','Pomodoro a tu medida, con alarma.',()=>'Hoy: '+(S.focus[today()]||0)+' min'],['cal','Calendario','cal','#c9f1ec','#9edbd4','Semana, mes y bitácora a color.',()=>S.events.filter(e=>e.date==today()).length+' eventos hoy'],['fin','Finanzas','wallet','#d3f2e0','#a8dfc2','Bolsillos y gastos con clave o huella.',()=>S.pockets.length+' bolsillos'],['insp','Inspiración','spark','#ffe3c8','#f9c49a','Afirmaciones y tu vision board.',()=>S.vb.length+' recuerdos']];
const go2=t=>{S.tab=t;save();render();scrollTo(0,0)},cs=el=>{const i=Math.round(el.scrollLeft/(el.firstElementChild.offsetWidth+12));document.querySelectorAll('.cd i').forEach((d,j)=>d.classList.toggle('on',j==i))};
const tools=()=>`<h2>Tus herramientas</h2><div class="car" onscroll="cs(this)">${TL.map(t=>`<button class="tl" style="--a:${t[3]};--b:${t[4]}" onclick="go2('${t[0]}')"><span class="ic">${I(t[2])}</span><span><b>${t[1]}</b><small>${t[5]}</small></span><em>${t[6]()} · Abrir</em></button>`).join('')}</div><div class="cd">${TL.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><div class="qk"><button class="chip" onclick="glForm()">${I('plus',14)} Meta</button><button class="chip" onclick="tkForm()">${I('plus',14)} Tarea</button><button class="chip" onclick="evForm()">${I('plus',14)} Evento</button><button class="chip" onclick="txForm()">${I('plus',14)} Gasto</button><button class="chip" onclick="go2('life')">${I('timer',14)} Enfocar</button></div>`;
/* ===== Metas con color, enlazadas a tareas y calendario ===== */
const GC=['#f4a6c1','#f9c49a','#f3dc8e','#a8dfc2','#9edbd4','#a9c8f5','#c8b3f0','#d4c0b5'],gcl=id=>(S.goals.find(g=>g.id==id)||{}).c||'',gnm=id=>(S.goals.find(g=>g.id==id)||{}).t||'';
const dots=k=>{const c=[...S.events.filter(e=>e.date==k).map(e=>gcl(e.g)||'var(--sec)'),...S.tasks.filter(x=>x.due==k).map(x=>gcl(x.g)||'var(--sec)'),...S.goals.filter(g=>g.due==k).map(g=>g.c)].slice(0,3);return c.length?c.map(x=>`<i class="dt" style="background:${x}"></i>`).join(''):'&nbsp;'};
const dayRows=k=>[...S.events.filter(e=>e.date==k).sort(byT).map(e=>row(e.time,E(e.t),e.cat,e.done,`te(${e.id})`,gcl(e.g))),...S.tasks.filter(x=>x.due==k).map(t=>row('',E(t.t),'Entrega · '+(gnm(t.g)||t.tag||'Tarea'),t.dn,`tt(${t.id})`,gcl(t.g))),...S.goals.filter(g=>g.due==k).map(g=>row('Meta',E(g.t),'Fecha objetivo',0,`S.tab='goals';render()`,g.c))].join('');
function goalsV(){return `<div class="row sp" style="margin:0 20px 12px"><h1 style="font-size:24px">Mis metas</h1><button class="b" onclick="glForm()">${I('plus',16)} Nueva meta</button></div>`+(S.goals.map(g=>{const ts=S.tasks.filter(x=>x.g==g.id),d=ts.filter(x=>x.dn).length,p=ts.length?Math.round(d/ts.length*100):0;return `<div class="c gl" style="--gc:${g.c}"><div class="row sp"><div class="row"><span class="ic" style="background:${g.c}80;color:#3b2d78">${I('star')}</span><div><b>${E(g.t)}</b><div class="mu">${g.due?'Objetivo: '+fd(g.due)+' · ':''}${d} de ${ts.length} tareas</div></div></div><b style="color:var(--pri)">${p}%</b></div><div class="bar" style="margin:12px 0 6px"><i style="width:${p}%;background:${g.c}"></i></div>${ts.map(x=>`<div class="row ln"><button class="ck ${x.dn?'on':''}" ${x.dn?`style="background:${g.c};border-color:${g.c}"`:''} onclick="tt(${x.id})">${x.dn?I('check',16):''}</button><span class="${x.dn?'dn':''}">${E(x.t)}</span><span class="mu">${x.due?fd(x.due):''}</span></div>`).join('')}<div class="row" style="margin-top:10px"><button class="b b2" style="flex:1" onclick="tkForm(${g.id})">${I('plus',16)} Tarea</button><button class="chip" onclick="glForm(${g.id})">Editar</button><button class="chip" onclick="dg(${g.id})">Eliminar</button></div></div>`}).join('')||'<div class="c" style="text-align:center"><p class="mu">Aún no tienes metas. Crea una, elige su color y enlaza tus tareas.</p></div>')}
const pc2=b=>{document.querySelectorAll('.sw button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
function dg(id){if(!confirm('¿Eliminar esta meta? Sus tareas se conservan sin meta.'))return;S.goals=S.goals.filter(g=>g.id!=id);S.tasks.forEach(x=>{if(x.g==id)x.g=''});S.events.forEach(x=>{if(x.g==id)x.g=''});save();render()}
render();
</script></body></html>
