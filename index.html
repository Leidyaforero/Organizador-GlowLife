<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fdecef">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GlowLife">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>GlowLife</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdecef;--card:#fff;--well:#fff6f8;--bd:#f8b4c4;--pri:#9c4161;--sec:#f48fb1;--tx:#22191c;--mu:#6b575b;--onp:#fff;--sh:0 8px 24px -4px rgba(244,143,177,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a1d21;--card:#382e30;--well:#43363a;--bd:#6a4a55;--pri:#ffb1c7;--tx:#feedf0;--mu:#d9c0c5;--onp:#3f001c;--sh:none}}
:root[data-theme=dark]{--bg:#2a1d21;--card:#382e30;--well:#43363a;--bd:#6a4a55;--pri:#ffb1c7;--tx:#feedf0;--mu:#d9c0c5;--onp:#3f001c;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}body{font:400 14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);max-width:560px;margin:auto;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
header b{font-size:20px;color:var(--pri)}.mu{color:var(--mu);font-size:12px}h2{margin:12px 20px 8px;font-size:18px;color:var(--pri)}h1{color:var(--pri)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;margin:0 20px 14px;box-shadow:var(--sh)}.it{padding:12px 16px;border-radius:20px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.big{font-size:32px;font-weight:700;color:var(--pri)}
.b{border:0;border-radius:99px;background:var(--pri);color:var(--onp);font:600 14px inherit;font-family:inherit;padding:12px 18px;min-height:44px;cursor:pointer;box-shadow:0 8px 16px -4px rgba(156,65,97,.25)}.b2{background:var(--well);color:var(--pri);border:1px solid var(--bd);box-shadow:none}
input,select{width:100%;background:var(--well);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font:inherit;color:var(--tx);min-height:44px}input:focus,select:focus{outline:2px solid var(--pri)}
.bar{height:10px;border-radius:9px;background:var(--well)}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f8b4c4,var(--pri))}
.chip{border:1px solid var(--bd);background:var(--well);color:var(--pri);border-radius:99px;padding:8px 14px;font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}.chip.on{background:var(--pri);color:var(--onp)}.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px}
.ck{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sec);background:var(--well);flex:none;cursor:pointer;color:var(--onp);display:grid;place-items:center;padding:0}.ck.on{background:var(--pri)}.dn{text-decoration:line-through;opacity:.6}
.ic{width:40px;height:40px;border-radius:50%;background:var(--well);color:var(--pri);display:grid;place-items:center;flex:none}.b{display:inline-flex;align-items:center;justify-content:center;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 10px inherit;font-family:inherit;padding:6px 0;border-radius:20px;cursor:pointer}nav button.on{background:var(--well);color:var(--pri)}nav span{display:block;color:var(--sec);margin-bottom:2px}nav button.on span{color:var(--pri)}nav svg{display:block;margin:auto}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;display:grid;place-items:center;z-index:8}
.dys{display:flex;gap:6px;margin:0 20px 14px}.dy{flex:1;border:0;border-radius:99px;background:var(--card);color:var(--tx);padding:10px 0;font:600 11px inherit;font-family:inherit;cursor:pointer;display:grid;gap:2px}.dy b{font-size:16px}.dy.on{background:var(--pri);color:var(--onp)}
.ob{min-height:90vh;display:grid;place-content:center;gap:16px;padding:32px;text-align:center}
#sh{display:none}#sh.on{display:flex;position:fixed;inset:0;z-index:20;align-items:flex-end;justify-content:center}.bk{position:absolute;inset:0;background:rgba(56,46,48,.5)}
.sb{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:32px 32px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:grid;gap:12px}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--pri);color:var(--onp);padding:10px 18px;border-radius:99px;z-index:30;display:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{font-size:18px;color:var(--pri);display:block}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 20px 14px}.vt{position:relative;border-radius:24px;overflow:hidden;background:var(--well);aspect-ratio:1}.vt img,.vt video{width:100%;height:100%;object-fit:cover;display:block}.vt button{position:absolute;top:8px;right:8px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 20px 14px;text-align:center}.md{border:0;border-radius:14px;background:var(--card);padding:6px 0;font:600 13px inherit;font-family:inherit;color:var(--tx);min-height:46px;cursor:pointer}.md.on{background:var(--pri);color:var(--onp)}
</style></head><body><div id="app"></div><div id="sh"></div><div id="ts"></div>
<script>
const K='glowlife_v1',$=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),pad=n=>String(n).padStart(2,'0');
const $m=n=>'$'+Number(n).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2}),fd=d=>new Date(d+'T12:00').toLocaleDateString('es',{day:'numeric',month:'short'});
const DQ=['Todo lo que sueñas está esperando que te organices para recibirlo con calma y constancia.','Un paso suave a la vez crea el camino que sueñas hoy.','Me permito florecer a mi propio ritmo sin compararme con los jardines ajenos.','Mi valor no disminuye por cometer errores; cada tropiezo refina mi brillo.','Lo que es para mí, me encuentra en paz.'];
const P={house:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',wallet:'<path d="M3 7a2 2 0 012-2h13v4M3 7v11a2 2 0 002 2h15V9H5a2 2 0 01-2-2zM16 14.5h2"/>',tasks:'<path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',flame:'<path d="M12 22c4 0 7-2.8 7-6.5 0-3-2-5-3.5-7-.5 2.5-2 3-2.5 2.500.5-3-1-6-3-8 0 4-5 6-5 12.500C5 19.200 8 22 12 22z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM12 9v6M9 12h6"/>',plane:'<path d="M21 3L3 10.500l6.500 2.500L12 20l2.500-5.500zM9.500 13L21 3"/>',cap:'<path d="M2 9l10-5 10 5-10 5zM6 11.500V16c0 1.500 3 3 6 3s6-1.500 6-3v-4.500M22 9v6"/>',heart:'<path d="M12 20s-8-5-8-11a4.500 4.500 0 018-2.800A4.500 4.500 0 0120 9c0 6-8 11-8 11z"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8S10 3 7.500 4.500 9 8 12 8zm0 0s2-5 4.500-3.500S15 8 12 8z"/>',star:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100-5.400-2.900-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5M8 7h7"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.500l4.500 4.500L19 7.500"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',refresh:'<path d="M20 11a8 8 0 10-2.300 5.700M20 4v7h-7"/>',cl:'<path d="M15 5l-7 7 7 7"/>',cr:'<path d="M9 5l7 7-7 7"/>'};
const I=(n,s=22,f)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||P.heart}</svg>`,pi=p=>P[p.i]?p.i:({1:'shield',2:'plane',3:'cap'}[p.id]||'heart'),PO=[['shield','Emergencia'],['plane','Viaje'],['cap','Estudios'],['house','Hogar'],['gift','Regalo'],['book','Libros'],['star','Sueño'],['heart','Bienestar']];
const TAGS=['Universidad','Metas','Fitness'],CATS=['Universidad','Finanzas','Fitness','Meta personal'],DN=['L','M','X','J','V','S','D'],HB=['2 L de agua','10k pasos','Estiramiento'];
const def=()=>({name:'',tab:'home',pockets:[{id:1,n:'Fondo de Emergencia',i:'shield',g:2500,v:0},{id:2,n:'Ahorro a Futuro',i:'plane',g:3000,v:0},{id:3,n:'Gastos & Universidad',i:'cap',g:1000,v:0}],tx:[],tasks:[],events:[],h:{d:'',a:[0,0,0]},focus:{},act:{},q:[],fav:[],vb:[]});
let S,T={left:1500,end:0,id:0},V={wo:0,mo:0,sel:today(),ct:'w',f:'Todas'},ok=true;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){ok=false}S=Object.assign(def(),S||{});
const save=()=>{S.act[today()]=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false;toast('Este navegador no permite guardar')}};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class="bk" onclick="shut()"></div><div class="sb">'+h+'</div>';$('#sh').className='on'}
function shut(){$('#sh').className='';$('#sh').innerHTML=''}
const streak=()=>{let n=0,d=new Date();if(!S.act[iso(d)])d.setDate(d.getDate()-1);while(S.act[iso(d)]){n++;d.setDate(d.getDate()-1)}return n};
const pc=p=>p.g?Math.min(100,Math.round(p.v/p.g*100)):0,pend=()=>S.tasks.filter(x=>!x.dn).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1),byT=(a,b)=>a.time>b.time?1:-1;
const ring=(p,t,i)=>`<svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--well)" stroke-width="8"/><circle id="${i}g" cx="50" cy="50" r="45" fill="none" stroke="var(--pri)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2.83*p} 283" transform="rotate(-90 50 50)"/><text id="${i}t" x="50" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="var(--pri)">${t}</text></svg>`;
const row=(r,t,s,on,fn)=>`<div class="c it row"><button class="ck ${on?'on':''}" onclick="${fn}">${on?I('check',16):''}</button><div style="flex:1"><b class="${on?'dn':''}">${t}</b><div class="mu">${s}</div></div><span class="mu">${r}</span></div>`;
const hb=()=>{if(S.h.d!=today())S.h={d:today(),a:[0,0,0]};return S.h.a};

function render(){if(!S.name)return onb();const v={home,fin:finG,life,cal,insp}[S.tab]();
const N=[['home','Inicio','house'],['fin','Finanzas','wallet'],['life','Vida & Metas','tasks'],['cal','Calendario','cal'],['insp','Inspiración','spark']];
$('#app').innerHTML=`<header><div><b>GlowLife</b></div><div class="row"><span class="chip">${I('flame',14)} ${streak()}d</span><button class="ic b2" style="border:1px solid var(--bd);cursor:pointer;font:700 16px inherit;color:var(--pri)" onclick="prof()" aria-label="Perfil">${E(S.name[0].toUpperCase())}</button></div></header><main>${v}</main><nav>${N.map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="S.tab='${n[0]}';save();render();scrollTo(0,0)"><span>${I(n[2])}</span>${n[1]}</button>`).join('')}</nav>`;document.querySelectorAll('.fab').forEach(b=>b.innerHTML=I('plus',26));if(S.tab=='insp')loadM()}
function onb(){$('#app').innerHTML=`<div class="ob"><div style="color:var(--sec);display:grid;place-items:center">${I('spark',64)}</div><h1>GlowLife</h1><p class="mu" style="font-size:14px">Tu espacio para organizar finanzas, estudio y metas.</p><input id="nm" placeholder="¿Cómo te llamas?" maxlength="30" autocomplete="given-name"><button class="b" onclick="go()">Comenzar</button><p class="mu">${ok?'Tus datos se guardan en este dispositivo.':'Aviso: este navegador no permite guardar datos.'}</p></div>`}
function go(){const n=$('#nm').value.trim();if(!n)return toast('Escribe tu nombre');S.name=n;save();render()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&document.activeElement.id=='nm')go()});

function home(){const a=hb(),p=pend()[0],lo=S.pockets.slice().sort((x,y)=>pc(x)-pc(y))[0],tot=S.pockets.reduce((s,x)=>s+x.v,0);
const adv=p?`Tienes <b>${E(p.t)}</b> pendiente${p.due?' para el '+fd(p.due):''}. Dedica un bloque de 25 min hoy.`:lo?`Tu bolsillo <b>${E(lo.n)}</b> va en ${pc(lo)}%. ¿Reservas algo hoy?`:'Agrega tu primera tarea para organizar tu día.';
const ev=S.events.filter(e=>e.date==today()).sort(byT).map(e=>row(e.time,E(e.t),e.cat,e.done,`te(${e.id})`)),tk=pend().slice(0,4).map(t=>row(t.due?fd(t.due):'',E(t.t),t.tag,0,`tt(${t.id})`)),n=ev.length+tk.length,pr=Math.round(a.reduce((s,x)=>s+x,0)/3*100);
return `<div style="padding:0 20px 12px"><div class="mu">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</div><h1 style="font-size:28px">¡Hola, ${E(S.name)}!</h1><div class="mu" style="font-size:14px">Tu día está lleno de luz y posibilidades.</div></div>
<div class="c" style="background:linear-gradient(135deg,var(--card),var(--well))"><div class="row"><span class="ic">${I('spark')}</span><div><b>GlowBot</b> <span class="chip">Consejo</span><div style="margin-top:4px">${adv}</div></div></div><div class="row" style="margin-top:12px"><button class="b" style="flex:1" onclick="S.tab='life';render()">Aceptar sugerencia</button></div></div>
<div class="c"><div class="row sp"><span class="mu">Balance total disponible</span><button class="chip" onclick="txForm()" aria-label="Nueva transacción">${I('plus',16)}</button></div><div class="big">${UN?$m(tot):'$ ••••'}</div><div class="g3" style="margin-top:10px">${S.pockets.slice(0,3).map(x=>`<div class="ic" style="width:auto;height:auto;border-radius:16px;padding:8px;display:block"><span class="mu">${E(x.n.split(' ')[0])}</span><b>${pc(x)}%</b></div>`).join('')}</div></div>
<h2>Enfoque de hoy <span class="mu">${n} actividades</span></h2><div style="padding:0 20px">${ev.join('')+tk.join('')||'<p class="mu">Nada pendiente. ¡Disfruta tu día!</p>'}</div>
<div class="c row sp"><div><b style="color:var(--pri)">Reto Glow Fit</b><div class="mu" style="margin-bottom:6px">${a.reduce((s,x)=>s+x,0)} de 3 hábitos cumplidos</div>${HB.map((h,i)=>`<div class="row" style="margin:4px 0"><button class="ck ${a[i]?'on':''}" style="width:24px;height:24px" onclick="th(${i})">${a[i]?I('check',14):''}</button>${h}</div>`).join('')}</div>${ring(pr,pr+'%','h')}</div>
<div class="c" style="background:var(--well)"><i>“${E(qs()[new Date().getDate()%qs().length].t)}”</i></div>`}
const th=i=>{hb()[i]^=1;save();render()},te=id=>{const e=S.events.find(x=>x.id==id);e.done=!e.done;save();render()},tt=id=>{const x=S.tasks.find(x=>x.id==id);x.dn=x.dn?'':today();save();render()};

function fin(){const tot=S.pockets.reduce((s,x)=>s+x.v,0);
return `<div class="c"><div class="mu">BALANCE TOTAL ACUMULADO</div><div class="big">${$m(tot)}</div></div>
<div class="row" style="margin:0 20px 14px"><button class="b" style="flex:1" onclick="txForm()">${I('plus',16)} Transacción</button><button class="b b2" style="flex:1" onclick="pkForm()">Nuevo bolsillo</button></div><h2>Tus bolsillos</h2>
${S.pockets.map(p=>`<div class="c"><div class="row sp"><div class="row"><span class="ic">${I(pi(p))}</span><div><b>${E(p.n)}</b><div class="mu">${pc(p)}% de la meta</div></div></div><div style="text-align:right"><b>${$m(p.v)}</b><div class="mu">de ${$m(p.g)}</div></div></div><div class="bar" style="margin-top:12px"><i style="width:${pc(p)}%"></i></div></div>`).join('')}
<h2>Actividad reciente</h2><div style="padding:0 20px">${S.tx.slice(0,8).map(x=>`<div class="c it row sp"><div><b>${E(x.n)}</b><div class="mu">${fd(x.d)} · ${x.h} · ${E(x.p)}</div></div><b style="color:var(--pri)">${x.t=='i'?'+':'−'}${$m(x.a)}</b></div>`).join('')||'<p class="mu">Aún no hay movimientos.</p>'}</div>`}
function txForm(){if(!UN){S.tab='fin';render();return toast('Desbloquea Finanzas primero')}sheet(`<h2 style="margin:0">Nueva transacción</h2><input id="ta" type="number" inputmode="decimal" placeholder="Monto" min="0"><select id="tt"><option value="g">Gasto</option><option value="i">Ingreso</option></select><select id="tp">${S.pockets.map(p=>`<option value="${p.id}">${E(p.i+' '+p.n)}</option>`).join('')}</select><input id="tn" placeholder="Nota (ej. Matcha latte)"><button class="b" onclick="saveTx()">Guardar movimiento</button>`)}
function saveTx(){const a=parseFloat($('#ta').value);if(!(a>0))return toast('Ingresa un monto');const p=S.pockets.find(x=>x.id==$('#tp').value),t=$('#tt').value,n=new Date();if(p)p.v+=t=='i'?a:-a;S.tx.unshift({a,t,p:p?p.n:'',n:$('#tn').value||(t=='i'?'Ingreso':'Gasto'),d:iso(n),h:pad(n.getHours())+':'+pad(n.getMinutes())});save();shut();render()}
function pkForm(){sheet(`<h2 style="margin:0">Nuevo bolsillo</h2><input id="pn" placeholder="Nombre (ej. Viaje a Kioto)"><select id="pi">${PO.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><input id="pg" type="number" inputmode="decimal" placeholder="Meta de ahorro"><button class="b" onclick="savePk()">Crear bolsillo</button>`)}
function savePk(){const n=$('#pn').value.trim();if(!n)return toast('Ponle un nombre');S.pockets.push({id:Date.now(),n,i:$('#pi').value,g:parseFloat($('#pg').value)||0,v:0});save();shut();render()}

function life(){const m=pad(Math.floor(T.left/60))+':'+pad(T.left%60),L=['Todas',...TAGS],ts=S.tasks.filter(x=>V.f=='Todas'||x.tag==V.f).sort((a,b)=>!!a.dn-!!b.dn);
return `<div class="c" style="text-align:center"><div class="row sp"><b style="color:var(--pri)">Enfoque Pomodoro</b><span class="chip">Hoy: ${S.focus[today()]||0} min</span></div><div style="margin:8px 0">${ring(T.left/15,m,'t')}</div><div class="row"><button class="b" style="flex:1" onclick="tp()">${T.id?'Pausar':'Iniciar bloque (25 min)'}</button><button class="b b2" onclick="tr()" aria-label="Reiniciar">${I('refresh',18)}</button></div></div>
<div class="chips">${L.map(f=>`<button class="chip ${V.f==f?'on':''}" onclick="V.f='${f}';render()">${f}</button>`).join('')}</div>
<div class="row sp" style="margin:0 20px 8px"><b style="font-size:18px;color:var(--pri)">Tareas y metas</b><button class="b" onclick="tkForm()">${I('plus',16)} Nueva</button></div><div style="padding:0 20px">${ts.map(x=>row(x.due?fd(x.due):'',E(x.t),x.tag+` · <a href="#" onclick="dt(${x.id});return false" style="color:var(--mu)">eliminar</a>`,x.dn,`tt(${x.id})`)).join('')||'<p class="mu">Sin tareas. Toca “Nueva” para empezar.</p>'}</div>`}
function upd(){const g=$('#tg');if(g){g.setAttribute('stroke-dasharray',2.83*T.left/15+' 283');$('#tt').textContent=pad(Math.floor(T.left/60))+':'+pad(T.left%60)}}
function tk(){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));if(T.left<=0){clearInterval(T.id);T.id=0;T.left=1500;S.focus[today()]=(S.focus[today()]||0)+25;save();toast('¡Bloque completado!');render()}else upd()}
function tp(){if(T.id){clearInterval(T.id);T.id=0}else{T.end=Date.now()+T.left*1000;T.id=setInterval(tk,500)}render()}
function tr(){clearInterval(T.id);T.id=0;T.left=1500;render()}
function tkForm(){sheet(`<h2 style="margin:0">Nueva tarea</h2><input id="kt" placeholder="¿Qué quieres lograr?"><select id="kg">${TAGS.map(t=>`<option>${t}</option>`).join('')}</select><input id="kd" type="date"><button class="b" onclick="saveTk()">Guardar tarea</button>`)}
function saveTk(){const t=$('#kt').value.trim();if(!t)return toast('Escribe la tarea');S.tasks.push({id:Date.now(),t,tag:$('#kg').value,due:$('#kd').value,dn:''});save();shut();render()}
function dt(id){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}

function cal(){const b=new Date();b.setDate(b.getDate()-(b.getDay()+6)%7+V.wo*7);const ds=[...Array(7)].map((_,i)=>{const d=new Date(b);d.setDate(b.getDate()+i);return d});
const tabs=`<div class="chips">${[['w','Semana'],['m','Mes'],['b','Bitácora']].map(x=>`<button class="chip ${V.ct==x[0]?'on':''}" onclick="V.ct='${x[0]}';sw();render()">${x[1]}</button>`).join('')}</div>`;
if(V.ct=='b')return tabs+bit(ds);if(V.ct=='m')return tabs+mon();
const ev=S.events.filter(e=>e.date==V.sel).sort(byT).map(e=>row(e.time,E(e.t),e.cat,e.done,`te(${e.id})`)),tk=S.tasks.filter(x=>x.due==V.sel).map(t=>row('',E(t.t),'Entrega · '+t.tag,t.dn,`tt(${t.id})`));
return tabs+`<div class="row sp" style="margin:0 20px 10px"><h1 style="font-size:22px;text-transform:capitalize">${b.toLocaleDateString('es',{month:'long',year:'numeric'})}</h1><div class="row"><button class="chip" onclick="wk(-1)" aria-label="Anterior">${I('cl',16)}</button><button class="chip" onclick="wk(1)" aria-label="Siguiente">${I('cr',16)}</button></div></div>
<div class="dys">${ds.map((d,i)=>{const k=iso(d);return `<button class="dy ${k==V.sel?'on':''}" onclick="V.sel='${k}';render()">${DN[i]}<b>${d.getDate()}</b><span>${S.events.some(e=>e.date==k)?'•':'&nbsp;'}</span></button>`}).join('')}</div>
<h2 style="text-transform:capitalize">${new Date(V.sel+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</h2><div style="padding:0 20px">${ev.join('')+tk.join('')||'<p class="mu">Día libre. Toca ＋ para programar algo.</p>'}</div><button class="b fab" onclick="evForm()" aria-label="Nuevo evento">＋</button>`}
function wk(n){const d=new Date(V.sel+'T12:00');d.setDate(d.getDate()+7*n);V.sel=iso(d);V.wo+=n;render()}
function evForm(){sheet(`<h2 style="margin:0">Nuevo evento</h2><input id="et" placeholder="Título"><input id="eh" type="time" value="09:00"><input id="ed" type="date" value="${V.sel}"><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button class="b" onclick="saveEv()">Guardar evento</button>`)}
function saveEv(){const t=$('#et').value.trim();if(!t)return toast('Escribe un título');S.events.push({id:Date.now(),t,time:$('#eh').value||'09:00',date:$('#ed').value||V.sel,cat:$('#ec').value,done:false});save();V.sel=$('#ed').value||V.sel;shut();render()}
function stat(a,b){const r=d=>d>=a&&d<=b,sm=(t)=>S.tx.filter(x=>x.t==t&&r(x.d)).reduce((s,x)=>s+x.a,0);return{'Tareas':S.tasks.filter(x=>x.dn&&r(x.dn)).length,'Eventos':S.events.filter(x=>x.done&&r(x.date)).length,'Min. foco':Object.entries(S.focus).filter(([d])=>r(d)).reduce((s,[,v])=>s+v,0),'Ingresos':$m(sm('i')),'Gastos':$m(sm('g'))}}
function bit(ds){const m=today().slice(0,7),sec=(t,o)=>`<div class="c"><b style="color:var(--pri)">${t}</b><div class="g3" style="margin-top:10px">${Object.entries(o).map(([k,v])=>`<div><b>${v}</b><span class="mu">${k}</span></div>`).join('')}</div></div>`;
return sec('Esta semana',stat(iso(ds[0]),iso(ds[6])))+sec('Este mes',stat(m+'-01',m+'-31'))+'<p class="mu" style="margin:0 20px">Lo que completas se archiva aquí por semana y por mes.</p>'}

const qs=()=>DQ.map(t=>({t})).concat(S.q);
function insp(){const q=qs();return `<div style="padding:0 20px 12px"><h1 style="font-size:24px">Tu rincón de calma, energía y visión</h1></div>
<div class="c" style="background:linear-gradient(135deg,var(--card),var(--well))"><div class="mu">AFIRMACIÓN DEL DÍA</div><p style="font-size:20px;font-style:italic;color:var(--pri);margin:8px 0">“${E(q[new Date().getDate()%q.length].t)}”</p></div>
<div class="c row" style="cursor:pointer" onclick="qForm()"><span class="ic">${I('plus')}</span><b style="color:var(--pri)">Agregar mi propia frase</b></div><h2>Mi Vision Board <span class="mu">${S.vb.length} recuerdos</span></h2><div class="c row" style="cursor:pointer" onclick="$('#vf').click()"><span class="ic">${I('plus')}</span><b style="color:var(--pri)">Subir foto o video</b></div><input id="vf" type="file" accept="image/*,video/*" multiple hidden onchange="vup(this.files)"><div class="vg">${S.vb.map(x=>`<div class="vt">${x.v?`<video id="m${x.id}" controls playsinline muted></video>`:`<img id="m${x.id}" alt="Recuerdo">`}<button class="chip" onclick="vd('${x.id}')" aria-label="Quitar">${I('x',14)}</button></div>`).join('')}</div><h2>Biblioteca de afirmaciones</h2>
${q.map(x=>`<div class="c it row sp"><i>“${E(x.t)}”</i><button class="chip" onclick="fv(this.dataset.t)" data-t="${E(x.t)}" aria-label="Favorita">${I('heart',16,S.fav.includes(x.t))}</button></div>`).join('')}`}
const fv=t=>{S.fav=S.fav.includes(t)?S.fav.filter(x=>x!=t):[...S.fav,t];save();render()};
function qForm(){sheet(`<h2 style="margin:0">Mi frase</h2><input id="qt" placeholder="Escribe una frase que te inspire"><button class="b" onclick="const t=$('#qt').value.trim();if(t){S.q.push({t});save();shut();render()}">Guardar frase</button>`)}

let DB;const idb=()=>DB||(DB=new Promise((res,rej)=>{const r=indexedDB.open('glowlife',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const mput=async(k,b)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const mget=async k=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction('m').objectStore('m').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}};
const mdel=async k=>{try{(await idb()).transaction('m','readwrite').objectStore('m').delete(k)}catch(e){}};
const shrink=f=>new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.8)};i.onerror=rej;i.src=u});
async function vup(fs){for(const f of fs){try{const v=f.type.startsWith('video');if(v&&f.size>60e6){toast('Video muy pesado (máx. 60 MB)');continue}const b=v?f:await shrink(f),id=Date.now()+Math.random().toString(36).slice(2,6);await mput(id,b);S.vb.push({id,v})}catch(e){toast('No se pudo guardar el archivo')}}save();render()}
async function loadM(){for(const x of S.vb){const e=$('#m'+x.id);if(!e)continue;const b=await mget(x.id);if(b)e.src=URL.createObjectURL(b);else{S.vb=S.vb.filter(y=>y.id!=x.id);save();e.parentElement.remove()}}}
const vd=id=>{S.vb=S.vb.filter(x=>x.id!=id);mdel(id);save();render()};
const mw=n=>{V.mo+=n;render()};
function sw(){const a=new Date(V.sel+'T12:00'),b=new Date();a.setDate(a.getDate()-(a.getDay()+6)%7);b.setDate(b.getDate()-(b.getDay()+6)%7);V.wo=Math.round((a-b)/6048e5)}
function mon(){const f=new Date();f.setDate(1);f.setMonth(f.getMonth()+V.mo);const y=f.getFullYear(),m=f.getMonth(),n=new Date(y,m+1,0).getDate(),lead=(f.getDay()+6)%7,td=today(),has=k=>S.events.some(e=>e.date==k)||S.tasks.some(t=>t.due==k);
const cs=[...Array(lead).fill(null),...Array.from({length:n},(_,i)=>new Date(y,m,i+1))],ev=S.events.filter(e=>e.date==V.sel).sort(byT).map(e=>row(e.time,E(e.t),e.cat,e.done,`te(${e.id})`)),tk=S.tasks.filter(x=>x.due==V.sel).map(t=>row('',E(t.t),'Entrega · '+t.tag,t.dn,`tt(${t.id})`));
return `<div class="row sp" style="margin:0 20px 10px"><h1 style="font-size:22px;text-transform:capitalize">${f.toLocaleDateString('es',{month:'long',year:'numeric'})}</h1><div class="row"><button class="chip" onclick="mw(-1)" aria-label="Mes anterior">${I('cl',16)}</button><button class="chip" onclick="mw(1)" aria-label="Mes siguiente">${I('cr',16)}</button></div></div><div class="mg">${DN.map(d=>`<span class="mu">${d}</span>`).join('')}${cs.map(d=>{if(!d)return '<span></span>';const k=iso(d);return `<button class="md ${k==V.sel?'on':''}" ${k==td?'style="outline:2px solid var(--sec)"':''} onclick="V.sel='${k}';render()">${d.getDate()}<br><small>${has(k)?'•':'&nbsp;'}</small></button>`}).join('')}</div><h2 style="text-transform:capitalize">${new Date(V.sel+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</h2><div style="padding:0 20px">${ev.join('')+tk.join('')||'<p class="mu">Día libre. Toca ＋ para programar algo.</p>'}</div><button class="b fab" onclick="evForm()" aria-label="Nuevo evento">＋</button>`}
function prof(){sheet(`<h2 style="margin:0">Mi perfil</h2><input id="pnm" value="${E(S.name)}" maxlength="30"><button class="b" onclick="const n=$('#pnm').value.trim();if(n){S.name=n;save();shut();render()}">Guardar nombre</button><p class="mu">Copia de seguridad: copia este texto y guárdalo; para restaurar, pégalo aquí y toca Restaurar.</p><input id="bk" value="${E(JSON.stringify(S))}"><div class="row"><button class="b b2" style="flex:1" onclick="bc()">Copiar</button><button class="b b2" style="flex:1" onclick="br()">Restaurar</button></div>${LK.h&&canBio()?`<button class="b b2" onclick="bioOn()">${LK.c?'Volver a configurar':'Activar'} huella / bloqueo del celular</button>`:''}<button class="b b2" onclick="wp(this)">Borrar todos mis datos</button>`)}
function bc(){const i=$('#bk');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}toast('Copiado')}
function br(){try{const o=JSON.parse($('#bk').value);if(!o.name)throw 0;S=Object.assign(def(),o);save();shut();render();toast('Datos restaurados')}catch(e){toast('Texto no válido')}}
function wp(b){if(b.dataset.s){S=def();LK={};UN=false;try{localStorage.removeItem(K);localStorage.removeItem(LKEY)}catch(e){}shut();render()}else{b.dataset.s=1;b.textContent='Toca otra vez para confirmar'}}
/* ===== Candado de Finanzas (clave + huella), todo en el dispositivo ===== */
const LKEY='glowlife_lock';let LK={},UN=false,F=0,UT=0;try{LK=JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){}
const lsave=()=>{try{localStorage.setItem(LKEY,JSON.stringify(LK))}catch(e){toast('No se pudo guardar la clave')}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),canBio=()=>!!(window.PublicKeyCredential&&navigator.credentials);
async function hp(p,sl){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(sl),iterations:150000,hash:'SHA-256'},k,256))}
const finG=()=>UN?fin():`<div class="ob"><div style="color:var(--sec);display:grid;place-items:center">${I('shield',64)}</div><h1>Finanzas protegidas</h1><p class="mu" style="font-size:14px">Hola, ${E(S.name)}. ${LK.h?'Ingresa tu clave para continuar.':'Crea una clave para proteger tus finanzas.'}</p><input id="lp" type="password" placeholder="Clave" autocomplete="current-password">${LK.h?'':'<input id="lp2" type="password" placeholder="Repite la clave" autocomplete="new-password">'}<button class="b" onclick="${LK.h?'unlock()':'setPw()'}">${LK.h?'Entrar':'Crear clave'}</button>${LK.h&&LK.c?'<button class="b b2" onclick="bio()">Usar huella o bloqueo del celular</button>':''}${LK.h?'<a href="#" class="mu" onclick="forgot();return false">Olvidé mi clave</a>':''}</div>`;
async function setPw(){const a=$('#lp').value,b=$('#lp2').value;if(a.length<6)return toast('Usa mínimo 6 caracteres');if(a!=b)return toast('Las claves no coinciden');const sl=b64(crypto.getRandomValues(new Uint8Array(16)));LK={s:sl,h:await hp(a,sl)};lsave();UN=true;render();toast(canBio()?'Clave creada. Activa tu huella en el perfil':'Clave creada')}
async function unlock(){if(Date.now()<UT)return toast('Espera 30 segundos e intenta de nuevo');if(await hp($('#lp').value,LK.s)===LK.h){F=0;UN=true;render()}else{if(++F>=5){UT=Date.now()+3e4;F=0}toast('Clave incorrecta')}}
async function bioOn(){if(!UN)return toast('Primero entra a Finanzas con tu clave');try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'GlowLife'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:S.name,displayName:S.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});LK.c=b64(c.rawId);lsave();shut();toast('Huella activada')}catch(e){toast('No se pudo activar la huella')}}
async function bio(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub(LK.c)}],userVerification:'required',timeout:60000}});UN=true;render()}catch(e){toast('No se pudo verificar')}}
function forgot(){if(confirm('Si olvidaste tu clave se borrarán TODOS tus datos de este dispositivo. ¿Continuar?')){S=def();LK={};UN=false;try{localStorage.removeItem(K);localStorage.removeItem(LKEY)}catch(e){}render()}}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&['lp','lp2'].includes(document.activeElement.id))LK.h?unlock():setPw()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)UN=false;else if(S.tab=='fin')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
